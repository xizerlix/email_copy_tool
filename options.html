<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 15px;
      width: 350px;
      background-color: #f9f9f9;
    }

    h3 {
      margin-top: 0;
      color: #333;
    }

    label.title-label {
      font-size: 12px;
      color: #666;
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      margin-bottom: 15px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-family: monospace;
    }

    textarea {
      resize: vertical;
    }

    button {
      cursor: pointer;
      background: #ff4444;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 4px;
      font-weight: bold;
      transition: background 0.2s;
      margin-top: 10px;
    }

    button:hover {
      background: #cc0000;
    }

    .settings-group {
      margin-bottom: 20px;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .checkbox-wrapper:has(input:not(:checked)) {
      opacity: 0.7;
    }

    .checkbox-wrapper:has(input:checked) {
      opacity: 1;
    }

    .checkbox-wrapper input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
      cursor: pointer;
    }

    .checkbox-wrapper label {
      font-size: 14px;
      margin-bottom: 0;
      color: #333;
      font-weight: normal;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>

<body>
  <h3>Plugin settings</h3>

  <label class="title-label">Website URLs (new line or commas):</label>
  <textarea id="targetUrl" rows="3" placeholder="creatio-dev.com&#10;creatio-prod.com"></textarea>

  <label class="title-label">Email domains (new line or commas):</label>
  <textarea id="domains" rows="5" placeholder="@nornik.ru&#10;@gmail.com"></textarea>

  <div class="settings-group">
    <div class="checkbox-wrapper">
      <input type="checkbox" id="allowDuplicates">
      <label for="allowDuplicates">Allow repeated copying in a row</label>
    </div>

    <div class="checkbox-wrapper">
      <input type="checkbox" id="massCopy">
      <label for="massCopy">Bulk copying (all addresses at once)</label>
    </div>
  </div>

  <button id="save">Save settings</button>

  <script src="options.js"></script>
</body>

</html>
